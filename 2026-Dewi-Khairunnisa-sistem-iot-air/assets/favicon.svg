<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Latar belakang transparan -->
  <rect width="800" height="800" fill="none" />

  <!-- Grup Utama dengan ketebalan garis dan sudut membulat -->
  <g stroke="#000000" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gelembung Kiri Atas -->
    <circle cx="190" cy="208" r="48" fill="#7CECE6" />
    
    <!-- Gelembung Kiri Tengah -->
    <circle cx="89" cy="486" r="48" fill="#7CECE6" />
    
    <!-- Gelembung Kiri Bawah -->
    <circle cx="170" cy="721" r="70" fill="#7CECE6" />
    
    <!-- Gelembung Kanan Atas -->
    <circle cx="578" cy="116" r="82" fill="#7CECE6" />
    
    <!-- Gelembung Kanan Tengah -->
    <circle cx="709" cy="610" r="48" fill="#7CECE6" />
    
    <!-- Gelembung Kanan Bawah -->
    <circle cx="550" cy="721" r="48" fill="#7CECE6" />
    
    <!-- Tetesan Air Besar di Tengah -->
    <path d="M 400,165 
             C 400,165 205,420 205,535 
             A 195,195 0 0,0 595,535 
             C 595,420 400,165 400,165 Z" 
          fill="#3DB4CC" />
          
    <!-- Gelembung Menempel di Kanan Tetesan Air -->
    <circle cx="505" cy="500" r="62" fill="#7CECE6" />
  </g>
</svg>
